name: Equilibrium PR safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: equilibrium-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Record PR identity before checkout
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p .ci-provenance
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(".ci-provenance/pr.json").write_text(json.dumps({
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "base_sha": os.environ["BASE_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
          }), encoding="utf-8")
          PY
      - name: Publish immutable PR provenance
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-identity
          path: .ci-provenance/pr.json
          if-no-files-found: error
          retention-days: 2
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate combat datasets
        run: npm run data:rebuild
      - name: TypeScript checks
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.tests.json
      - name: Combat simulation and shared pipeline regression tests
        run: npx vitest run src/combat/engine src/combat/pipeline
