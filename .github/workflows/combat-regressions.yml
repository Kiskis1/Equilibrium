name: Equilibrium combat regression checks

on:
  pull_request:
    paths:
      - "src/combat/**"
      - ".github/workflows/combat-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invention-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Rebuild pinned combat data
        run: npm run data:rebuild
      - name: Check types
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.tests.json
      - name: Invention focused and runtime regressions
        run: npx vitest run src/combat/shared/inventionRuntime.test.ts src/combat/engine/resolution/procs/invention.test.ts
      - name: Full engine regression suite
        run: npm run test:simulation
